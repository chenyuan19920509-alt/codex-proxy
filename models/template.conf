# ============================================================
# Model Configuration Template
# ============================================================
# All values are KEY=VALUE, parsed by the proxy's loadConfig().
# Priority: env vars > ~/.config/codex-proxy/config > .env > defaults.
# ============================================================

# ── Required ──

# PROXY_MODEL: Model identifier sent to the upstream API.
# Must match what the upstream expects (e.g. "gpt-4o").
# PROXY_MODEL=

# PROXY_UPSTREAM: Base URL of the upstream OpenAI-compatible API.
# Include /v1 suffix if the upstream uses it.
# PROXY_UPSTREAM=https://api.example.com/v1

# ── Optional ──

# PROXY_API_KEY: API key for the upstream service.
# Can also be set via environment variable (higher priority).
# PROXY_API_KEY=sk-your-key-here

# PROXY_PORT: Local port the proxy listens on.
# Default: 4446
# PROXY_PORT=4446

# PROXY_MAX_BODY_TOKENS: Max token budget for the request body.
# Controls two things:
#   1. System prompt truncation: max_instruction_chars = (MAX_BODY_TOKENS - 5000) * 4
#   2. Agent tool gating: if < 16000, heavy tools (spawn_agent, send_input,
#      resume_agent, wait_agent, close_agent) are dropped automatically.
# Default: 262144
# PROXY_MAX_BODY_TOKENS=262144

# ── Tool Policy (informational — enforced by proxy logic) ──
#
# apply_patch is ALWAYS removed by translateTools() regardless of config.
# Weak models can't format unified diff; they use read/write/exec_command instead.
#
# Agent management tools are auto-removed when PROXY_MAX_BODY_TOKENS < 16000.
# To force-remove them at any budget, set:
#   TOOLS_DROP=spawn_agent,send_input,resume_agent,wait_agent,close_agent
#
# To force-keep them (not recommended for weak models):
#   TOOLS_DROP=

# ── Safety Notes ──
# The proxy injects a bash safety note into the system prompt:
#   "When writing bash scripts with `set -e`, use `N=$((N+1))` instead of
#    `((N++))`, because `((0))` exits 1 in bash."
# This is always present. Stronger models (DeepSeek, GPT-4 class) handle this
# natively, but the note costs nothing to keep.
